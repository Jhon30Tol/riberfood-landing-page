
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riberfood - Tudo o que seu delivery precisa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .orange-gradient {
        background: linear-gradient(135deg, #ff6b00 0%, #ff8a3d 100%);
      }
    </style>
    <script>
      // Desativa o botão direito
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Desativa atalhos comuns de inspeção (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
      document.onkeydown = function(e) {
        if (
          e.keyCode === 123 || 
          (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
          (e.ctrlKey && e.keyCode === 85)
        ) {
          return false;
        }
      };

      // Opcional: Debugger loop para atrapalhar quem abrir o console (use com cautela)
      /*
      setInterval(() => {
        debugger;
      }, 500);
      */
    </script>
</head>
  <body class="bg-gray-50">
    <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
