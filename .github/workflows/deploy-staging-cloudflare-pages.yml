name: Deploy STG Landing to Cloudflare Pages

on:
  push:
    branches:
      - main
      - staging
      - preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing (stg)
        env:
          VITE_APP_ENV: stg
          VITE_ONBOARDING_TENANTS_URL: ${{ vars.VITE_ONBOARDING_TENANTS_URL_STG || 'https://stg.riberfood.com/api/v1/onboarding/tenants' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages (stg)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name ${{ vars.CF_PAGES_PROJECT_STG }}
            --branch preview
